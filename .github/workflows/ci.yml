name: CI

on:
  push:
    branches:
      - main
      - dev
      - workflows
  pull_request:
    branches:
      - main
      - dev

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Make gradlew executable (Unix)
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Run tests (Unix)
        if: runner.os != 'Windows'
        run: ./gradlew test --no-daemon

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew.bat test --no-daemon
