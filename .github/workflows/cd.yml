name: CD

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target_env:
        description: "Environnement à déployer"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build with tests
        run: ./gradlew clean build --no-daemon

      - name: Upload bootJar
        uses: actions/upload-artifact@v4
        with:
          name: boot-jar
          path: build/libs/*.jar
          if-no-files-found: error

  publish-image:
    name: Publish Docker Image (GHCR)
    runs-on: ubuntu-latest
    needs: build
    outputs:
      image_sha_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download bootJar
        uses: actions/download-artifact@v4
        with:
          name: boot-jar
          path: build/libs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: publish-image
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.target_env == 'staging')
    environment: staging
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT || '22' }}
          script_stop: true
          script: |
            set -e
            IMAGE="ghcr.io/${{ github.repository }}:sha-${{ github.sha }}"
            APP_DIR="${{ secrets.STAGING_APP_DIR }}"
            CONTAINER_NAME="backend-clean-staging"

            mkdir -p "$APP_DIR/data"

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            docker pull "$IMAGE"
            docker rm -f "$CONTAINER_NAME" || true
            docker run -d --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              -p 8080:8080 \
              -e APP_SECURITY_JWT_SECRET="${{ secrets.STAGING_JWT_SECRET }}" \
              -v "$APP_DIR/data:/app/data" \
              "$IMAGE"

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: publish-image
    if: github.event_name == 'workflow_dispatch' && inputs.target_env == 'production'
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_PORT || '22' }}
          script_stop: true
          script: |
            set -e
            IMAGE="ghcr.io/${{ github.repository }}:sha-${{ github.sha }}"
            APP_DIR="${{ secrets.PROD_APP_DIR }}"
            CONTAINER_NAME="backend-clean-prod"

            mkdir -p "$APP_DIR/data"

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            docker pull "$IMAGE"
            docker rm -f "$CONTAINER_NAME" || true
            docker run -d --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              -p 8080:8080 \
              -e APP_SECURITY_JWT_SECRET="${{ secrets.PROD_JWT_SECRET }}" \
              -v "$APP_DIR/data:/app/data" \
              "$IMAGE"
