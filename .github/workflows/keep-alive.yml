name: Keep Render Alive

on:
  schedule:
    # S'exécute toutes les 12 minutes (UTC)
    - cron: '*/12 * * * *'
  workflow_dispatch: # Pour pouvoir le lancer à la main

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render
        run: |
          curl -f -L -s https://backend-caisse.onrender.com/ping || echo "Réveil en cours"